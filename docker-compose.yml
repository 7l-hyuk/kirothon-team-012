# 로컬: docker compose up -d db   (앱은 uv로 직접 실행)
# 서버: docker compose --env-file /opt/shingomate/.env up -d --build  (deploy/deploy.sh)
# 포트가 겹치면 DB_PORT(db, 기본 5432), APP_PORT(app, 기본 80)로 호스트 포트를 바꿀 수 있습니다.
# --env-file의 값은 아래 environment 에 ${VAR} 로 적은 것만 컨테이너에 들어갑니다.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shingo-local}
      POSTGRES_DB: ${POSTGRES_DB:-shingomate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # 외부에 열지 않습니다

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://shingo:shingo-local@db:5432/shingomate}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      PRESIGN_EXPIRES_SECONDS: ${PRESIGN_EXPIRES_SECONDS:-3600}
    # S3_BUCKET 없이 띄울 때(로컬 디스크 저장)도 컨테이너를 새로 만들어 사진이 사라지지 않게 합니다.
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
