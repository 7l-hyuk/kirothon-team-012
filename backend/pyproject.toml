[project]
name = "shingomate-backend"
version = "0.2.0"
description = "신고메이트 백엔드 (AI 호출 + 메모리 저장소. 키가 없으면 가짜 응답)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "psycopg[binary]",
    "python-multipart",
    "boto3",
    "anthropic",
    "pydantic-settings",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
