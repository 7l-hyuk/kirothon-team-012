[project]
name = "shingomate-backend"
version = "0.1.0"
description = "신고메이트 백엔드 (현재는 가짜 API 뼈대)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "psycopg[binary]",
    "python-multipart",
    "boto3",
    "anthropic",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
