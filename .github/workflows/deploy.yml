name: Deploy

# main에 push되면 EC2에서 deploy/deploy.sh를 실행합니다.
# AWS 자격 증명은 저장하지 않고 OIDC로 임시 권한을 받습니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: AWS 임시 자격 증명 받기
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 서버에서 배포 스크립트 실행
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          cat > params.json <<JSON
          {
            "executionTimeout": ["1200"],
            "commands": [
              "set -e",
              "mkdir -p /opt/shingomate",
              "if [ ! -d /opt/shingomate/repo/.git ]; then git clone --branch main ${REPO_URL} /opt/shingomate/repo; fi",
              "cd /opt/shingomate/repo && git fetch --prune origin main && git reset --hard origin/main",
              "REPO_URL=${REPO_URL} BRANCH=main bash /opt/shingomate/repo/deploy/deploy.sh"
            ]
          }
          JSON
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM 명령 ID: $COMMAND_ID"

          STATUS=InProgress
          for i in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- 서버 오류 출력 -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "최종 상태: $STATUS"
          [ "$STATUS" = "Success" ]
